---
layout: default
---
<article class="article">
  <a class="back-link" href="{{ '/' | relative_url }}">← Todos los writeups</a>
 
  <header class="article-header">
    <p class="eyebrow">{{ page.category | default: "WRITEUP" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.date %}<p class="meta">{{ page.date | date: "%d-%m-%Y" }}</p>{% endif %}
    {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
  </header>
 
  {% if page.image %}
    <img class="article-cover" src="{{ page.image | relative_url }}" alt="Portada: {{ page.title | escape }}">
  {% endif %}
 
  <div class="prose">
    {{ content }}
  </div>
</article>
